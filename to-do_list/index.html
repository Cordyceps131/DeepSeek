<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="#">
    <title>To-do_List</title>
    <script src="./app.js" type="module"></script>
</head>

<body>
    <form id="input-container">
        <input id="input" type="search" placeholder="Introduzir tarefa...">
        <button id="input-btn" title="Adicionar Tarefa">Adicionar</button>
    </form>
    <p id="msg"></p>
    <section>
        <ul id="lista-tarefas">
        </ul>
        <p id="contador"></p>
    </section>
    <form id="form" style="display: none; position: absolute; height: 300px; width: 100px;">
        <input id="form-input" type="text">
        <button id="form-btn">Alterar</button>
        <button id="form-cancelar">Cancelar</button>
    </form>
</body>

</html>
