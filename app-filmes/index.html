<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fletnix</title>
    <script src="./app.js" type="module"></script>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./Amanita_Muscaria.png">
</head>

<body>
    <header>
        <a href="./index.html" id="title">Fletnix</a>
        <form action="./index.html" class="haeder-search">
            <input type="search" name="SEARCH" placeholder="Search for Movies / Series..." id="search-bar">
            <button id="search-btn">Search</button>
        </form>
    </header>

    <main>
        <section class="filters">
            <div>
                <input type="search" id="filter-text" placeholder="Filtrar por ano...">
                <button id="filter-btn">Enter</button>
            </div>
            <p id="msg"></p>
        </section>
        <section class="list" id="movies-container">
        </section>
    </main>

</body>

</html>
